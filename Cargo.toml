[workspace]
resolver = "2"
members = [
  # Engine: no DOM, tested natively
  "crates/term",
  "crates/subst",
  "crates/syntax",
  "crates/rules",
  "crates/strategy",
  "crates/explore",
  "crates/layout",
  "crates/examples",
  # Browser
  "crates/motion",
  "crates/widgets",
  # Facade crate
  "crates/redex",
  # Binary crates
  "bin/page",
]

# House Lint. tree-sitter builds C; a member would pay that in every
# compile-matrix job, and only the House Lint job needs the binary.
exclude = ["crates/lints"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
license      = "MIT"
publish      = false

[workspace.dependencies]
# Internal crates
term     = { path = "crates/term" }
subst    = { path = "crates/subst" }
syntax   = { path = "crates/syntax" }
rules    = { path = "crates/rules" }
strategy = { path = "crates/strategy" }
explore  = { path = "crates/explore" }
layout   = { path = "crates/layout" }
examples = { path = "crates/examples" }
motion   = { path = "crates/motion" }
widgets  = { path = "crates/widgets" }
redex    = { path = "crates/redex" }

# External dependencies
leptos                   = { version = "0.8.8", features = ["csr"] }
leptos_meta              = "0.8.5"
wasm-bindgen             = "0.2"
js-sys                   = "0.3"
web-sys                  = "0.3"
gloo-timers              = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1.7"
serde                    = { version = "1.0", features = ["derive"] }
serde_json               = "1"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }

# Clippy gate: `pedantic = warn` + `-D warnings` in CI. Allows below
# are house-style preferences.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# House-style patterns adopted with the robopoker crate reorg (folded
# module trees, bitset arithmetic, index-paired loops, etc.).
module_inception                   = "allow"
if_same_then_else                  = "allow"
should_implement_trait             = "allow"
needless_range_loop                = "allow"
len_without_is_empty               = "allow"
new_without_default                = "allow"
ptr_arg                            = "allow"
suspicious_map                     = "allow"
suspicious_arithmetic_impl         = "allow"
format_in_format_args              = "allow"
filter_map_bool_then               = "allow"
inspect_for_each                   = "allow"
obfuscated_if_else                 = "allow"
unnecessary_lazy_evaluations       = "allow"
toplevel_ref_arg                   = "allow"
inconsistent_digit_grouping        = "allow"
nonminimal_bool                    = "allow"
unusual_byte_groupings             = "allow"
zero_prefixed_literal              = "allow"
option_map_unit_fn                 = "allow"
let_unit_value                     = "allow"
unit_arg                           = "allow"
type_complexity                    = "allow"
too_many_arguments                 = "allow"
wildcard_imports                   = "allow"
enum_glob_use                      = "allow" # house style: prefer glob imports
must_use_candidate                 = "allow"
must_use_unit                      = "allow"
return_self_not_must_use           = "allow"
doc_markdown                       = "allow"
missing_errors_doc                 = "allow"
missing_panics_doc                 = "allow"
cast_precision_loss                = "allow"
cast_possible_truncation           = "allow"
cast_possible_wrap                 = "allow"
cast_sign_loss                     = "allow"
cast_lossless                      = "allow"
float_cmp                          = "allow"
match_same_arms                    = "allow"
match_like_matches_macro           = "allow" # explicit `match … => true` preferred
match_wildcard_for_single_variants = "allow"
needless_pass_by_value             = "allow"
similar_names                      = "allow"
too_many_lines                     = "allow"
module_name_repetitions            = "allow"
struct_field_names                 = "allow"
default_trait_access               = "allow"
unreadable_literal                 = "allow"
large_futures                      = "allow"
unused_async                       = "allow"
unused_async_trait_impl            = "allow" # 1.98 sibling of unused_async
assert_is_empty                    = "allow" # 1.99: assert_eq!(x, [] as [T; 0]) reads worse
struct_excessive_bools             = "allow"
missing_assert_message             = "allow"
into_iter_without_iter             = "allow"
iter_without_into_iter             = "allow"
needless_for_each                  = "allow"
format_push_string                 = "allow"
trivially_copy_pass_by_ref         = "allow"
large_types_passed_by_value        = "allow"
unused_self                        = "allow"
items_after_statements             = "allow"
needless_continue                  = "allow"
redundant_else                     = "allow"
copy_iterator                      = "allow"
many_single_char_names             = "allow"

[profile.release]
lto           = true
panic         = "abort"
opt-level     = "z"
codegen-units = 1
strip         = "debuginfo"
